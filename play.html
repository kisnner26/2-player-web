<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cargando… · 2 Player Arcade</title>
  <link rel="stylesheet" href="core/theme.css">
  <link rel="stylesheet" href="core/game.css">
  <link rel="stylesheet" href="core/consola.css">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <!-- Misma línea que en index.html: la piel tiene que estar puesta antes del
       primer pintado. Aquí solo viste el chrome (marcador, pausa, briefing). -->
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('2pa:settings') || '{}').skin;
      // 'wiiu' es el nombre viejo de esta piel: se acepta para no dejar sin
      // aspecto a quien la tuviera ya guardada.
      document.documentElement.dataset.skin = (!s || s === 'wiiu') ? 'consola' : s;
    } catch { document.documentElement.dataset.skin = 'consola'; }
  </script>
</head>
<body data-theme="arcade">
  <div id="stage">
    <div id="frame">
      <canvas id="canvas"></canvas>
      <div id="dom-root" hidden></div>
      <div id="scanlines"></div>
      <div id="flash"></div>

      <div id="game-topbar">
        <button class="btn small ghost" data-act="exit" title="Salir al menú (Esc)">← Menú</button>
        <button class="btn small ghost" data-act="pause" title="Pausa (Esc)">⏸</button>
        <button class="btn small ghost" data-act="fullscreen" title="Pantalla completa">⛶</button>
      </div>

      <div id="loading">
        <div>
          <div class="spin"></div>
          <p style="color:var(--ink-dim);font-size:13px;margin-top:14px">Cargando juego…</p>
        </div>
      </div>
      <pre id="load-error" hidden></pre>
    </div>
  </div>

  <script type="module" src="core/shell.js"></script>
</body>
</html>
